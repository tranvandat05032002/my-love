<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1/6/2026❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body,
#intro-screen,
#main-screen{
    height:100dvh;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
    background: #05000a;
}

canvas {
    will-change: transform;
}

/* =======================
   INTRO SCREEN
======================= */
#intro-screen {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: radial-gradient(circle at center, #1f0024, #0a0015 70%, #030007);
    z-index: 10;
    transition: opacity 1.5s ease;
}

#stars {
    position: absolute;
    inset: 0;
    display: block;
}

.intro-content {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

#typing {
    color: white;
    font-size: 1.8rem;
    text-align: center;
    margin-bottom: 60px;
    min-height: 2.5rem;
    text-shadow: 0 0 10px #ff3366, 0 0 20px rgba(255, 51, 102, 0.6);
}

body {
    touch-action: none;
    overscroll-behavior: none;
}

.heart-wrapper {
    position: relative;
    width: 200px;
    height: 200px;
    cursor: pointer;
}

.heart3d {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 110px;
    animation: heartFloat 2.5s ease-in-out infinite alternate;
    filter: drop-shadow(0 0 20px rgba(255, 0, 85, 0.8));
    user-select: none;
}

@keyframes heartFloat {
    0% { transform: scale(0.95) translateY(0px); }
    100% { transform: scale(1.05) translateY(-10px); }
}

.pulse {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1.5px solid rgba(255, 51, 102, 0.8);
}

.p1 { animation: ripple 3.5s infinite; }
.p2 { animation: ripple 3.5s infinite 1.1s; }

@keyframes ripple {
    from { transform: scale(0.5); opacity: 0.8; box-shadow: 0 0 10px #ff3366; }
    to { transform: scale(2.2); opacity: 0; box-shadow: 0 0 20px #ff3366; }
}

.tap-text {
    color: #ffb3d9;
    margin-top: 40px;
    font-size: 16px;
    letter-spacing: 4px;
    animation: pulseText 2s infinite alternate;
    opacity: 0.8;
}

@keyframes pulseText {
    from { opacity: 0.5; text-shadow: 0 0 5px rgba(255,179,217,0.3); }
    to { opacity: 1; text-shadow: 0 0 15px rgba(255,179,217,0.8); }
}

#orbit-center{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:0;
    height:0;
}

.meteor {
    position: absolute;
    width: 2px;
    height: 2px;
    background: #ffccdd;
    box-shadow: 0 0 8px #ff6699;
    opacity: 0;
    animation: slowMeteor 10s linear infinite;
}

.meteor::before {
    content: '';
    position: absolute;
    width: 100px;
    height: 1px;
    background: linear-gradient(to left, rgba(255,102,153,0.8), transparent);
    transform: translateX(-100px);
}

@keyframes slowMeteor {
    0% { transform: translate(80vw, -50px) rotate(-30deg); opacity: 0; }
    10% { opacity: 0.6; }
    20% { transform: translate(40vw, 20vh) rotate(-30deg); opacity: 0; }
    100% { transform: translate(40vw, 20vh) rotate(-30deg); opacity: 0; }
}

.sparkle {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 11;
}

/* =======================
   MAIN SCREEN 3D
======================= */
#main-screen {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, #1a0011, #020005 90%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 2s ease;
    overflow: hidden;
    perspective: 1200px;
}

#main-screen.active {
    opacity: 1;
    pointer-events: all;
    cursor: grab;
}
#main-screen.active:active {
    cursor: grabbing;
}

#instruction-text {
    position: absolute;
    top: 15%;
    width: 100%;
    text-align: center;
    color: rgba(255, 179, 217, 0.7);
    font-size: 14px;
    letter-spacing: 3px;
    text-transform: uppercase;
    z-index: 5;
    opacity: 0;
    transition: opacity 1.5s ease 2.5s; 
    pointer-events: none;
}

#main-screen.active #instruction-text {
    opacity: 1;
}

#particleHeartCanvas {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 2;
    pointer-events: none;
}

/* HỆ THỐNG QUỸ ĐẠO 3D CHO ẢNH */
#orbit-system {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;

    transform-style: preserve-3d;
    pointer-events: none;

    transform: translate(-50%, -50%);
}

.photo-item {
    position:absolute;

    width: clamp(60px,15vw,100px);
    height: clamp(60px,15vw,100px);

    margin-left:-65px;
    margin-top:-65px;
}

.photo-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* NÚT MỞ THIỆP */
#open-card-btn {
    position: absolute;
    bottom: 50px;
    z-index: 10;
    background: rgba(255, 20, 80, 0.2);
    border: 1px solid rgba(255, 77, 136, 0.5);
    color: #ffb3d9;
    padding: 10px 25px;
    border-radius: 20px;
    font-size: 15px;
    cursor: pointer;
    backdrop-filter: blur(5px);
    transition: all 0.3s ease, opacity 1.5s ease 2.5s;
    opacity: 0;
    visibility: hidden;
    pointer-events: auto; 
}

#open-card-btn:hover {
    background: rgba(255, 20, 80, 0.5);
    color: #fff;
    box-shadow: 0 0 15px rgba(255, 77, 136, 0.8);
}

#main-screen.active #open-card-btn {
    opacity: 1;
    visibility: visible;
}

/* BỨC THIỆP YÊU THƯƠNG */
#love-card {
    position: absolute;
    z-index: 20;
    background: linear-gradient(135deg, rgba(20, 0, 10, 0.9), rgba(10, 0, 5, 0.95));
    border: 1px solid rgba(255, 50, 100, 0.6);
    box-shadow: 0 0 40px rgba(255, 0, 80, 0.4);
    border-radius: 15px;
    padding: 35px 25px 25px;
    width: 90%;
    max-width: 400px;
    text-align: center;
    color: #fff;
    backdrop-filter: blur(10px);
    
    opacity: 0;
    transform: scale(0.8) translateY(30px);
    transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    pointer-events: none;
}

#love-card.show {
    opacity: 1;
    transform: scale(1) translateY(0);
    pointer-events: auto;
}

.close-btn {
    position: absolute;
    top: 10px;
    right: 15px;
    font-size: 20px;
    color: #ff4d88;
    cursor: pointer;
    transition: 0.3s;
}
.close-btn:hover {
    color: #fff;
    transform: scale(1.2);
}

#love-card h2 {
    color: #ff80aa;
    font-size: 24px;
    margin-bottom: 20px;
    font-style: italic;
    border-bottom: 1px dashed rgba(255, 77, 136, 0.3);
    padding-bottom: 15px;
}

#love-card p {
    font-size: 15px;
    line-height: 1.6;
    margin-bottom: 15px;
    color: #ffd1dc;
}

.floating-heart {
    position: absolute;
    color: #ff4d88;
    pointer-events: none;
    z-index: 1;
    filter: drop-shadow(0 0 3px rgba(255,77,136,0.4));
}
</style>
</head>

<body>

<audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<!-- MÀN HÌNH CHỜ -->
<div id="intro-screen">
    <canvas id="stars"></canvas>
    <div class="meteor" style="top:15%; left:30%; animation-delay: 0s;"></div>

    <div class="intro-content">
        <h1 id="typing"></h1>
        <div class="heart-wrapper" onclick="openMagicSpace(event)">

</div>

<!-- MÀN HÌNH CHÍNH 3D -->
<div id="main-screen">

    <!-- Trái tim hạt 3D -->
    <canvas id="particleHeartCanvas"></canvas>

    <!-- Quỹ đạo ảnh 3D -->
    <div id="orbit-center">
        <div id="orbit-system"></div>

    <h2>Gửi cô bạn nhỏ cụa tuii 💖</h2>

    <p>Chúc iem bíe có một ngày 1/6 thật vui 🧸</p>

    <p>
        Chúc iemm mọi thứ đều ổn: học tốt hơn, cười nhiều hơn, và ít áp lực hơn 🌷
    </p>

    <p>
        Chúc iemm bình an và vui vẻ như bây giờ ❤️
    </p>

    <p>
        Anh yêu em ❤️
    </p>
</div>
</div>

<script>
/* =======================================
   BIẾN ĐIỀU KHIỂN XOAY 3D CHUNG
======================================= */
let isDragging = false;
let startMouseX = 0;
let startMouseY = 0;
let targetRotX = 0; 
let targetRotY = 0; 
let currentRotX = 0; 
let currentRotY = 0; 
let time = 0;

/* =======================================
   HIỆU ỨNG GÕ CHỮ & SAO NỀN
======================================= */
const text = "Anh có một điều muốn gửi đến iemm bíe ❤️";
let textIndex = 0;

function typing(){
    if(textIndex < text.length){
        document.getElementById("typing").innerHTML += text[textIndex];
        textIndex++;
        setTimeout(typing, 80);
    }
}
window.onload = function() {
    typing(); // Chạy hiệu ứng gõ chữ
    if (typeof initHeartParticles === "function") {
        initHeartParticles(); // Kích hoạt lại trái tim hạt của bạn
    }
};

const canvasIntro = document.getElementById("stars");
const ctxIntro = canvasIntro.getContext("2d");
let starsArr = [];

function resizeIntro(){
    canvasIntro.width = window.innerWidth;
    canvasIntro.height = window.innerHeight;
}
resizeIntro();
window.addEventListener("resize", resizeIntro);

const particleColors = ['#ff0040', '#ff3366', '#ff80aa', '#ffb3cc', '#ffffff'];
for(let i = 0; i < 160; i++){
    starsArr.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        size: Math.random() * 2.5 + 0.5,
        color: particleColors[Math.floor(Math.random() * particleColors.length)],
        glowSpeed: Math.random() * 0.025 + 0.005,
        alpha: Math.random(),
        angle: Math.random() * Math.PI * 2,
        driftSpeed: Math.random() * 0.3 + 0.05
    });
}

function animateStars(){
    ctxIntro.clearRect(0, 0, canvasIntro.width, canvasIntro.height);
    starsArr.forEach(star => {
        star.alpha += star.glowSpeed;
        if(star.alpha > 1 || star.alpha < 0.1) star.glowSpeed *= -1;
        star.angle += 0.005;
        let xOffset = Math.sin(star.angle) * star.driftSpeed;
        let yOffset = Math.cos(star.angle) * star.driftSpeed;

        ctxIntro.beginPath();
        ctxIntro.arc(star.x + xOffset, star.y + yOffset, star.size, 0, Math.PI * 2);
        ctxIntro.shadowBlur = star.size * 4; 
        ctxIntro.shadowColor = star.color;
        ctxIntro.globalAlpha = star.alpha;
        ctxIntro.fillStyle = star.color;
        ctxIntro.fill();
        ctxIntro.shadowBlur = 0;
    });
    ctxIntro.globalAlpha = 1;
    requestAnimationFrame(animateStars);
}
animateStars();

/* =======================================
   CHUYỂN MÀN
======================================= */
function createGentleDust(x, y) {
    for (let i = 0; i < 30; i++) {
        const p = document.createElement("div");
        p.className = "sparkle";
        document.body.appendChild(p);
        const sparkColors = ['#ff0055', '#ff4d94', '#ffb3d9'];
        p.style.background = sparkColors[Math.floor(Math.random() * sparkColors.length)];
        p.style.boxShadow = `0 0 8px ${p.style.background}`;
        p.style.left = x + 'px';
        p.style.top = y + 'px';
        const angle = Math.random() * Math.PI - Math.PI; 
        const speed = Math.random() * 3 + 1;
        const vx = Math.cos(angle) * speed;
        const vy = Math.sin(angle) * speed - 0.5;
        let opacity = 1;
        function update() {
            x += vx; y += vy; opacity -= 0.02;
            if (opacity <= 0) p.remove();
            else {
                p.style.left = x + 'px'; p.style.top = y + 'px'; p.style.opacity = opacity;
                requestAnimationFrame(update);
            }
        }
        requestAnimationFrame(update);
    }
}

function openMagicSpace(e){
    const intro = document.getElementById("intro-screen");
    const main = document.getElementById("main-screen");
    const music = document.getElementById("bgMusic");

    music.play().catch(()=>{});
    createGentleDust(e.clientX, e.clientY);
    intro.style.opacity = "0";

    setTimeout(() => {
    intro.style.display = "none";
    main.classList.add("active");

    requestAnimationFrame(() => {
        resizeHeartCanvas();
        initHeartParticles();
        createOrbitPhotos3D();
        createSmallHearts();
        requestAnimationFrame(render3DScene);
    });

}, 1200);
}

function toggleCard() {
    const card = document.getElementById("love-card");
    if(card.classList.contains("show")) {
        card.classList.remove("show");
    } else {
        card.classList.add("show");
    }
}

/* =======================================
   TRÁI TIM LÝ TUÂN (LI XUN HEART)
======================================= */
const canvasHeart = document.getElementById("particleHeartCanvas");
const ctxHeart = canvasHeart.getContext("2d");
let heartParticles = [];

function resizeHeartCanvas() {
    const dpr = window.devicePixelRatio || 1;

    canvasHeart.style.width = window.innerWidth + "px";
    canvasHeart.style.height = window.innerHeight + "px";

    canvasHeart.width = window.innerWidth * dpr;
    canvasHeart.height = window.innerHeight * dpr;

    ctxHeart.setTransform(dpr, 0, 0, dpr, 0, 0);
}

resizeHeartCanvas();
window.addEventListener("resize", resizeHeartCanvas);

function initHeartParticles() {
    heartParticles = [];
    const numParticles =
    window.innerWidth < 768 ? 1500 :
    window.innerWidth < 1200 ? 3500 : 6000;

    for (let i = 0; i < numParticles; i++) {
        // Phương trình toán học chuẩn của trái tim Lý Tuân
        let t = Math.random() * Math.PI * 2;
        let x = 16 * Math.pow(Math.sin(t), 3);
        let y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
        
        let type = Math.random();
        let targetX, targetY, targetZ, color, size, speed;
        let scale = window.innerWidth < 768 ? 12 : 11;

        if (type < 0.20) { 
            // LỚP 1: HÀO QUANG (Halo) - Phân tán ra bên ngoài
            let spread = 1 + Math.random() * 0.25;
            targetX = x * spread * scale;
            targetY = y * spread * scale;
            targetZ = (Math.random() - 0.5) * 60; // Dày hơn ở trục Z để tạo khối mờ
            color = `hsla(345, 100%, 55%, ${0.2 + Math.random()*0.3})`;
            size = Math.random() * 1.5 + 0.5;
            speed = 0.03 + Math.random() * 0.02;
        } else if (type < 0.70) { 
            // LỚP 2: ĐƯỜNG VIỀN SÁNG (Edge) - Bám sát phương trình
            let spread = 1 + (Math.random() - 0.5) * 0.05;
            targetX = x * spread * scale;
            targetY = y * spread * scale;
            targetZ = (Math.random() - 0.5) * 20;
            color = `hsla(340, 100%, 80%, ${0.7 + Math.random()*0.3})`; // Trắng hồng rực rỡ
            size = Math.random() * 2 + 1;
            speed = 0.05 + Math.random() * 0.05;
        } else { 
            // LỚP 3: BÊN TRONG (Inside) - Phân tán vào lõi nhưng nhạt dần
            let spread = 1 - Math.pow(Math.random(), 2) * 0.7; // Logarithmic tập trung về viền
            targetX = x * spread * scale;
            targetY = y * spread * scale;
            targetZ = (Math.random() - 0.5) * 40;
            color = `hsla(330, 100%, 65%, ${0.4 + Math.random()*0.4})`;
            size = Math.random() * 1.5 + 0.5;
            speed = 0.04 + Math.random() * 0.03;
        }

        // Tọa độ xuất phát tán loạn từ ngoài vào
        let startX = (Math.random() - 0.5) * window.innerWidth * 1.5;
        let startY = (Math.random() - 0.5) * window.innerHeight * 1.5;
        let startZ = (Math.random() - 0.5) * 2000;

        heartParticles.push({
            x: startX,
            y: startY,
            z: startZ,
            baseTx: targetX,
            baseTy: targetY,
            baseTz: targetZ,
            color: color,
            size: size,
            speed: speed
        });
    }
}

/* =======================================
   TẠO ẢNH 3D QUAY QUANH
======================================= */
function createOrbitPhotos3D() {
    const orbit = document.getElementById("orbit-system");
    orbit.innerHTML = "";

    const photos = [
            "image/anh1.jpeg",
            "image/anh2.jpeg",
            "image/anh3.jpeg",
            "image/anh4.jpeg",
            "image/anh5.jpeg",
            "image/anh6.jpeg",
            "image/anh7.jpeg"
        ];

    const isMobile = window.innerWidth < 768;

    const radius = isMobile
    ? Math.min(window.innerWidth, window.innerHeight) * 0.45
    : Math.min(window.innerWidth, window.innerHeight) * 0.38;
    const golden = Math.PI * (3 - Math.sqrt(5));

    photos.forEach((src, i) => {

        const y = 1 - (i / (photos.length - 1)) * 2;
        const r = Math.sqrt(1 - y * y);
        const theta = golden * i;

        const x = Math.cos(theta) * r;
        const z = Math.sin(theta) * r;

        const el = document.createElement("div");
        el.className = "photo-item";

        el.style.transform = `
            translate3d(
                ${x * radius}px,
                ${y * radius * 0.9}px,
                ${z * radius * 0.7}px
            )
        `;

        const img = document.createElement("img");
        img.src = src;

        el.appendChild(img);
        orbit.appendChild(el);
    });
}

/* =======================================
   XỬ LÝ VUỐT/KÉO CHUỘT ĐỂ XOAY 3D
======================================= */
const mainScreen = document.getElementById("main-screen");

mainScreen.addEventListener('mousedown', (e) => {
    isDragging = true;
    startMouseX = e.clientX;
    startMouseY = e.clientY;
});
window.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    let deltaX = e.clientX - startMouseX;
    let deltaY = e.clientY - startMouseY;
    
    targetRotY += deltaX * 0.005; 
    targetRotX += deltaY * 0.005; 
    targetRotX = Math.max(-Math.PI/4, Math.min(Math.PI/4, targetRotX));

    startMouseX = e.clientX;
    startMouseY = e.clientY;
});
window.addEventListener('mouseup', () => { isDragging = false; });

mainScreen.addEventListener('touchstart', (e) => {
    isDragging = true;
    startMouseX = e.touches[0].clientX;
    startMouseY = e.touches[0].clientY;
});
window.addEventListener('touchmove', (e) => {
    if (!isDragging) return;
    let deltaX = e.touches[0].clientX - startMouseX;
    let deltaY = e.touches[0].clientY - startMouseY;
    
    targetRotY += deltaX * 0.005;
    targetRotX += deltaY * 0.005;
    targetRotX = Math.max(-Math.PI/4, Math.min(Math.PI/4, targetRotX));

    startMouseX = e.touches[0].clientX;
    startMouseY = e.touches[0].clientY;
});
window.addEventListener('touchend', () => { isDragging = false; });

/* =======================================
   VÒNG LẶP RENDER KHÔNG GIAN 3D
======================================= */
function render3DScene() {
    let lastTime = 0;

    if (!document.getElementById("main-screen").classList.contains("active")) {
        requestAnimationFrame(render3DScene);
        return;
    }

    time += 1; 

    // Tính toán tỷ lệ nhịp đập của trái tim (Mô phỏng nhịp đập kép Lub-Dub)
    let cycle = time % 100;
    let beatScale = 1;
    if (cycle < 15) {
        beatScale = 1 + Math.sin(cycle / 15 * Math.PI) * 0.12;
    } else if (cycle > 25 && cycle < 40) {
        beatScale = 1 + Math.sin((cycle - 25) / 15 * Math.PI) * 0.06;
    }

    if (!isDragging) {
        targetRotY += 0.002; 
        targetRotX += (0 - targetRotX) * 0.02; 
    }

    currentRotX += (targetRotX - currentRotX) * 0.1;
    currentRotY += (targetRotY - currentRotY) * 0.1;

    const orbit = document.getElementById("orbit-system");
    orbit.style.transform = `
rotateX(${-currentRotX}rad)
rotateY(${currentRotY}rad)
`;

    ctxHeart.clearRect(0, 0, canvasHeart.width, canvasHeart.height);
    let centerX = window.innerWidth / 2;
    let centerY = window.innerHeight / 2;

    // Cập nhật vị trí hạt với hiệu ứng giãn nở theo nhịp đập
    heartParticles.forEach(p => {
        let actualTx = p.baseTx * beatScale;
        let actualTy = p.baseTy * beatScale;
        let actualTz = p.baseTz * beatScale;

        // Nội suy mượt mà để hạt có "quán tính" khi bị kéo theo nhịp đập
        p.x += (actualTx - p.x) * p.speed;
        p.y += (actualTy - p.y) * p.speed;
        p.z += (actualTz - p.z) * p.speed;
    });

    let projected = heartParticles.map(p => {
        let x1 = p.x * Math.cos(currentRotY) - p.z * Math.sin(currentRotY);
        let z1 = p.z * Math.cos(currentRotY) + p.x * Math.sin(currentRotY);
        let y2 = p.y * Math.cos(currentRotX) - z1 * Math.sin(currentRotX);
        let z2 = z1 * Math.cos(currentRotX) + p.y * Math.sin(currentRotX);
        
        let perspective = 800 / (800 + z2); 
        return {
            x: centerX + x1 * perspective,
            y: centerY + y2 * perspective,
            z: z2,
            scale: perspective,
            color: p.color,
            size: p.size
        };
    });

    projected.sort((a, b) => b.z - a.z);

    projected.forEach(p => {
        if(p.scale > 0) {
            ctxHeart.beginPath();
            ctxHeart.arc(p.x, p.y, p.size * p.scale, 0, Math.PI * 2);
            ctxHeart.fillStyle = p.color;
            ctxHeart.shadowBlur = 0;
            ctxHeart.shadowColor = p.color;
            ctxHeart.fill();
            ctxHeart.shadowBlur = 0;
        }
    });

    requestAnimationFrame(render3DScene);
}

/* =======================================
   TRÁI TIM NHỎ BAY NỀN
======================================= */
function createSmallHearts() {
    setInterval(() => {
        if (!document.getElementById("main-screen").classList.contains("active")) return;
        const heart = document.createElement("div");
        heart.className = "floating-heart";
        heart.innerHTML = ["❤️", "💖", "💕", "✨"][Math.floor(Math.random() * 4)];
        document.getElementById("main-screen").appendChild(heart);

        let startX = Math.random() * window.innerWidth;
        let currentY = window.innerHeight + 20;
        let speed = Math.random() * 0.8 + 0.4;
        let amplitude = Math.random() * 20 + 10; 
        let theta = Math.random() * 50;

        heart.style.fontSize = (Math.random() * 5 + 8) + "px"; 
        heart.style.opacity = Math.random() * 0.4 + 0.1;

        function float() {
            currentY -= speed;
            theta += 0.02;
            heart.style.left = (startX + Math.sin(theta) * amplitude) + "px";
            heart.style.top = currentY + "px";
            if (currentY < -20) heart.remove();
            else requestAnimationFrame(float);
        }
        requestAnimationFrame(float);
    }, 250); 
}
